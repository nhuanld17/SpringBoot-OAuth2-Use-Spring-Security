spring.config.import=optional:file:.env[.properties]
spring.application.name=springboot-oauth2

# ============================================================
# Cấu hình Google OAuth2 (Phase 2 - Spring Security OAuth2 Client)
# ============================================================
# Client ID / Secret KHÔNG hardcode - đọc từ biến môi trường (hoặc file .env).
# Trong IntelliJ: Run > Edit Configurations > Environment variables:
#   GOOGLE_CLIENT_ID=...;GOOGLE_CLIENT_SECRET=...
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# Scope: CHỈ đọc lịch và sự kiện. KHÔNG có "openid" -> Spring xử lý như OAuth2 thuần
# (delegated authorization), không tạo OIDC login user.
spring.security.oauth2.client.registration.google.scope=https://www.googleapis.com/auth/calendar.readonly

# Authorization Code Grant
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code

# Redirect URI mặc định của Spring Security: /login/oauth2/code/{registrationId}
# => http://localhost:8080/login/oauth2/code/google
# LƯU Ý: phải đăng ký URI này trên Google Cloud Console (Authorized redirect URIs).
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.client-name=Google

# Endpoints của Google (Authorization Server)
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
