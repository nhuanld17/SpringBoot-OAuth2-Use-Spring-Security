spring.config.import=optional:file:.env[.properties]
spring.application.name=springboot-oauth2

# ============================================================
# Google OAuth2 config (Phase 1 - manual flow)
# ============================================================
# Client ID / Secret KHONG hardcode - doc tu bien moi truong.
# Trong IntelliJ: Run > Edit Configurations > Environment variables:
#   GOOGLE_CLIENT_ID=...;GOOGLE_CLIENT_SECRET=...
google.oauth.client-id=${GOOGLE_CLIENT_ID}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET}

# Redirect URI cho ban manual - phai trung voi URI da dang ky tren Google Console
google.oauth.redirect-uri=http://localhost:8080/oauth2/callback

# Scope: chi doc lich va su kien
google.oauth.scope=https://www.googleapis.com/auth/calendar.readonly

# Endpoints cua Google (Authorization Server)
google.oauth.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
google.oauth.token-uri=https://oauth2.googleapis.com/token
